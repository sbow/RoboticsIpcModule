# Jetson production profile — embedded robot compute (NVIDIA Jetson, L4T).
#
# Transport: per-peer SHM SPSC rings under /dev/shm. Same peer IDs and route
# rules as every other profile; the router process unlinks-then-creates each
# region on startup (ADR 0001 lifecycle).
#
# Sideband regions (per ADR 0005) are illustrated for the controller peer in
# anticipation of Phase F vision / ML bridges; the demo controller does not
# read them today.
#
# Usage:
#   ./build/ipc/test/router_server --config config/profiles/jetson_prod.toml
#
# See: docs/adr/0005-payload-policy-and-sideband.md, SYSTEM-VISION.md.

[router]
listen = "shm:/cpp_tricks_router"

[[peers]]
id    = 1
name  = "sensor"
local = "shm:/cpp_tricks_router_sensor"

[[peers]]
id    = 2
name  = "controller"
local = "shm:/cpp_tricks_router_controller"

  # Example sideband descriptors for Phase F bridges (camera + ML inference).
  # The controller doesn't consume them today, but Phase E systemd units will
  # spin up vision_metadata and ml_inference peers that publish into them.
  [[peers.sideband]]
  class             = "vision_nv12"
  name              = "/robot_vision_nv12"
  max_payload_bytes = 8388608      # 8 MB — one 1080p NV12 frame fits

  [[peers.sideband]]
  class             = "ml_tensor_in"
  name              = "/robot_ml_tensor_in"
  max_payload_bytes = 16777216     # 16 MB

[[peers]]
id    = 3
name  = "recorder"
local = "shm:/cpp_tricks_router_recorder"

[[routes]]
source = 1
dest   = [2, 3]

[[routes]]
source = 2
dest   = [3]
