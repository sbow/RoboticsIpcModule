# Cloud / CI simulation profile — Linux VM, container network.
#
# Phase F F1 deployment template. See docs/deployment-profiles.md for the
# full picture (profile selector, route topology, dashboard limitation).
#
# Transport: UDP on a private cloud subnet placeholder (replace 10.0.0.x
# with whatever the CI orchestrator assigns). Same peer IDs as every other
# profile; cross-host SHM is not supported (ADR 0005), so UDP is the only
# correct choice for multi-container deployments.
#
# Peer catalog (SYSTEM-VISION.md + docs/robotics-reference-layout.md):
#   1 sensor / 2 controller / 3 recorder — demo binaries (mocks in cloud sim)
#   4 vision_capture / 5 ml_inference / 8 dashboard_feed — Phase F sketches
#
# Peer IDs 6 (mavlink_gateway) and 7 (python_tooling) are reserved per the
# 8-peer catalog. Container addresses 10.0.0.7 / 10.0.0.8 (port 19206 / 19207)
# remain free for F4 / F2 to slot in.
#
# Routes within the 2-destination-per-source cap (RouteRule.dest0/dest1).
# Dashboard_feed (8) has no inbound route in F1 — see docs/deployment-profiles.md
# §Dashboard limitation and parked review C5.
#
# Usage:
#   ./build/ipc/test/router_server --config config/profiles/sim_cloud.toml
#
# See: docs/deployment-profiles.md (Phase F F1),
#      SYSTEM-VISION.md Cloud / CI sim row.

[router]
listen = "udp:10.0.0.1:19200"

[[peers]]
id    = 1
name  = "sensor"
local = "udp:10.0.0.2:19201"

[[peers]]
id    = 2
name  = "controller"
local = "udp:10.0.0.3:19202"

[[peers]]
id    = 3
name  = "recorder"
local = "udp:10.0.0.4:19203"

[[peers]]
id    = 4
name  = "vision_capture"
local = "udp:10.0.0.5:19204"

[[peers]]
id    = 5
name  = "ml_inference"
local = "udp:10.0.0.6:19205"

# Addresses 10.0.0.7 / 10.0.0.8 reserved for peers 6 (mavlink_gateway)
# / 7 (python_tooling).

[[peers]]
id    = 8
name  = "dashboard_feed"
local = "udp:10.0.0.9:19208"

# --- Routes (2-dest-per-source cap per parked review C5) ------------------

[[routes]]
source = 1                            # sensor   → controller + recorder
dest   = [2, 3]

[[routes]]
source = 2                            # controller → recorder
dest   = [3]

[[routes]]
source = 4                            # vision_capture → ml_inference + recorder
dest   = [5, 3]

[[routes]]
source = 5                            # ml_inference   → controller + recorder
dest   = [2, 3]
