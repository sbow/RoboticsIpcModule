# Cloud / CI simulation profile — Linux VM, container network.
#
# Phase F F1 deployment template. See docs/deployment-profiles.md for the
# full picture (profile selector, route topology, dashboard limitation).
#
# Transport: UDP on a private cloud subnet placeholder (replace 10.0.0.x
# with whatever the CI orchestrator assigns). Same peer IDs as every other
# profile; cross-host SHM is not supported (ADR 0005), so UDP is the only
# correct choice for multi-container deployments.
#
# Peer catalog (SYSTEM-VISION.md + docs/robotics-reference-layout.md):
#   1 sensor / 2 controller / 3 recorder — demo binaries (mocks in cloud sim)
#   4 vision_capture / 5 ml_inference / 8 dashboard_feed — Phase F sketches
#   7 python_tooling — Phase F F2 (examples/bridges/python_peer/)
#
# Peer ID 6 (mavlink_gateway) is reserved per the 8-peer catalog. Container
# address 10.0.0.7 (port 19206) remains free for F4 to slot in.
#
# Routes use the C5 Scope A lifted fan-out cap (kMaxRouteDests = 8).
# dashboard_feed (8) is now a tap on every compute-side rule. UDP sendto
# to a non-listening container succeeds at the kernel level; an idle
# dashboard is non-fatal here. python_tooling (7) is reached via the
# `source = 2` tap (F2).
#
# Usage:
#   ./build/ipc/test/router_server --config config/profiles/sim_cloud.toml
#
# See: docs/deployment-profiles.md (Phase F F1),
#      SYSTEM-VISION.md Cloud / CI sim row.

[router]
listen = "udp:10.0.0.1:19200"

[[peers]]
id    = 1
name  = "sensor"
local = "udp:10.0.0.2:19201"

[[peers]]
id    = 2
name  = "controller"
local = "udp:10.0.0.3:19202"

[[peers]]
id    = 3
name  = "recorder"
local = "udp:10.0.0.4:19203"

[[peers]]
id    = 4
name  = "vision_capture"
local = "udp:10.0.0.5:19204"

[[peers]]
id    = 5
name  = "ml_inference"
local = "udp:10.0.0.6:19205"

# Address 10.0.0.7 (port 19206) reserved for peer 6 (mavlink_gateway).

[[peers]]
id    = 7
name  = "python_tooling"
local = "udp:10.0.0.8:19207"

[[peers]]
id    = 8
name  = "dashboard_feed"
local = "udp:10.0.0.9:19208"

# --- Routes (kMaxRouteDests = 8 per closed C5 Scope A) --------------------

[[routes]]
source = 1                            # sensor    → controller + recorder + dashboard
dest   = [2, 3, 8]

[[routes]]
source = 2                            # controller → recorder + python + dashboard
dest   = [3, 7, 8]

[[routes]]
source = 4                            # vision    → ml + recorder + dashboard
dest   = [5, 3, 8]

[[routes]]
source = 5                            # ml_inference → controller + recorder + dashboard
dest   = [2, 3, 8]

[[routes]]
source = 7                            # python_tooling → recorder + dashboard
dest   = [3, 8]
