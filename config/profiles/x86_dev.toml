# x86 development profile — Linux laptop / workstation.
#
# Phase F F1 deployment template. See docs/deployment-profiles.md for the
# full picture (profile selector, route topology, dashboard limitation).
#
# Transport: UDS sockets under /tmp/rim_router_*.sock. Matches the established
# rim_ resource-name convention; no /dev/shm regions touched (dev laptops
# may or may not have CAP_IPC_LOCK / sufficient tmpfs sizing for SHM rings,
# and UDS is plenty fast for non-realtime dev work). All 6 peers share the
# same transport — easiest to swap between jetson_prod and x86_dev when
# iterating on a peer.
#
# Production-style x86 (under systemd, rim user) typically uses /run/rim/
# (created by `install -d -o rim -g rim /run/rim`); operators substitute
# the path prefix in this profile to match their `ReadWritePaths=`
# directive in rim-router.service. /tmp/ is the dev-on-laptop default
# because /run/ requires root and breaks `make test-router`.
#
# Peer catalog (SYSTEM-VISION.md + docs/robotics-reference-layout.md):
#   1 sensor / 2 controller / 3 recorder — demo binaries today
#   4 vision_capture / 5 ml_inference / 8 dashboard_feed — Phase F sketches
#   7 python_tooling — Phase F F2 (examples/bridges/python_peer/)
#
# vision_capture (4) and ml_inference (5) declare [[peers.sideband]] regions
# (ADR 0005) with memory_class = shm (ADR 0008/0012, F5) — the dev-laptop CPU
# path. jetson_prod.toml carries the same regions as nvbufsurface / cuda_managed.
# The [[topics]] sideband_idx values below index these per-peer tables.
#
# Peer ID 6 (mavlink_gateway) is reserved per the 8-peer catalog but not
# declared here — F4 will append it.
#
# Routes use the C5 Scope A lifted fan-out cap (kMaxRouteDests = 8 in
# ipc/src/router/routing.hpp). dashboard_feed (8) is now a tap on every
# compute-side rule, closing the F1 "dashboard has no inbound route"
# limitation. python_tooling (7) is reached via the `source = 2` tap
# (F2). Listing 8 at the end of every dest array preserves the pre-C5
# delivery order to the other destinations.
#
# Usage:
#   ./build/ipc/test/router_server --config config/profiles/x86_dev.toml
#
# See: docs/deployment-profiles.md (Phase F F1, C5 Scopes A+B),
#      docs/adr/0004-robotics-module-boundaries.md (module surface),
#      ipc/src/router/topology_loader.hpp (schema).

[router]
listen = "uds:/tmp/rim_router.sock"

[[peers]]
id    = 1
name  = "sensor"
local = "uds:/tmp/rim_router_sensor.sock"

[[peers]]
id    = 2
name  = "controller"
local = "uds:/tmp/rim_router_controller.sock"

[[peers]]
id    = 3
name  = "recorder"
local = "uds:/tmp/rim_router_recorder.sock"

[[peers]]
id    = 4
name  = "vision_capture"
local = "uds:/tmp/rim_router_vision_capture.sock"

  # NV12 sideband (ADR 0005). memory_class = shm (ADR 0008/0012, F5): a dev
  # laptop has no Orin iGPU / NvBufSurface, so the bridge stages pixels in
  # plain CPU shared memory. jetson_prod.toml carries the same logical
  # region as nvbufsurface. The vision_frame topic (id 300) below points at
  # this region via sideband_idx = 0.
  [[peers.sideband]]
  class             = "vision_nv12"
  name              = "/rim_vision_nv12"
  max_payload_bytes = 8388608        # 8 MB — one 1080p NV12 frame fits
  memory_class      = "shm"

[[peers]]
id    = 5
name  = "ml_inference"
local = "uds:/tmp/rim_router_ml_inference.sock"

  # ML tensor sidebands (ADR 0005), memory_class = shm on x86 dev. On Jetson
  # these are cuda_managed; the bridge / consumer reads memory_class from the
  # topology to pick its access path. ml_result (id 400) uses sideband_idx 1
  # (the ml_tensor_out region, the second entry on this peer).
  [[peers.sideband]]
  class             = "ml_tensor_in"
  name              = "/rim_ml_tensor_in"
  max_payload_bytes = 16777216       # 16 MB
  memory_class      = "shm"

  [[peers.sideband]]
  class             = "ml_tensor_out"
  name              = "/rim_ml_tensor_out"
  max_payload_bytes = 4194304        # 4 MB
  memory_class      = "shm"

[[peers]]
id    = 7
name  = "python_tooling"
local = "uds:/tmp/rim_router_python_tooling.sock"

[[peers]]
id    = 8
name  = "dashboard_feed"
local = "uds:/tmp/rim_router_dashboard.sock"

# --- Routes (kMaxRouteDests = 8 per closed C5 Scope A) --------------------

[[routes]]
source = 1                            # sensor    → controller + recorder + dashboard
dest   = [2, 3, 8]

[[routes]]
source = 2                            # controller → recorder + python + dashboard
dest   = [3, 7, 8]

[[routes]]
source = 4                            # vision    → ml + recorder + dashboard
dest   = [5, 3, 8]

[[routes]]
source = 5                            # ml_inference → controller + recorder + dashboard
dest   = [2, 3, 8]

[[routes]]
source = 7                            # python_tooling → recorder + dashboard
dest   = [3, 8]

# --- Topics (declarative; closed C5 Scope B) ------------------------------
# Declarative-only — the router ignores this catalog; bridges and tooling
# (examples/bridges/python_peer/, recorder, dashboard_feed) use it to
# validate published frames against the deployment's documented schema.
# sideband_idx defaults to kSidebandIdxNone (0xFFFF) when omitted, which
# matches the RouterFrame default for "no sideband attached".

[[topics]]
id            = 100
name          = "imu_proprio"
payload_class = "imu_proprio"

[[topics]]
id            = 200
name          = "controller_command"
payload_class = "controller_command"

[[topics]]
id            = 300
name          = "vision_frame"
payload_class = "vision_nv12"
sideband_idx  = 0

[[topics]]
id            = 400
name          = "ml_result"
payload_class = "ml_tensor_out"
sideband_idx  = 1
