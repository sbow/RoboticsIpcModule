# Phase D — CI PR gate. C3 (2026-06-03) — now a 2-arch matrix: x64 + aarch64.
#
# Build + run every test suite the local `make ci` target runs, on every
# push to main and every pull request, on BOTH x86_64 and native arm64
# GitHub-hosted runners. arm64 closes parked review C3 ("the module is named
# for Jetson/aarch64 but had never been built or run on aarch64 in CI").
# GitHub provides free native arm64 Linux runners (ubuntu-24.04-arm, 4 vCPU)
# for public repositories — no QEMU / cross-compile needed.
#
# Note on representativeness: the arm64 runner is a Cobalt/Neoverse N2 server
# core (Armv9), not a Jetson Orin Cortex-A78AE (Armv8.2 + L4T). It validates
# the aarch64 ABI, 64-bit atomics, endianness, and the syscalls the router
# uses (mlockall / sched_setaffinity / MSG_NOSIGNAL); the code has no SIMD /
# Tegra-specific paths. On-actual-Jetson validation remains an out-of-band
# operator check (cannot run inside GitHub-hosted CI regardless).
#
# What runs (per arch):
#   - apt install build-essential + ccache + sysstat
#   - ccache restore (keyed on arch + Makefile + commit; OS prefix fallthrough)
#   - make all                       (clean rebuild every binary)
#   - make test-ipc-unit             (unit assertions, incl. C6/C7)
#   - make test-ipc-integration      (integration scenarios)
#   - make test-router               (UDS / UDP / SHM forward scenarios)
#   - shm_leak_check.sh              (delta == 0 over the suite)
#
# Not in the PR gate (kept opt-in via workflow_dispatch or local make):
#   - make test-soak                 (D3 stress — minutes per N)
#   - make test-idle-cpu             (D3 60 s pidstat window)
#   - make test-latency-histogram    (D3 perf variance probe)
#   - make test-ipc                  (echo throughput; non-deterministic numbers)
# A future "nightly" job can call these on a schedule when their
# variance / runtime calls for it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Hand-trigger from the GitHub UI when debugging the workflow itself
  # or wanting a green check on a long-lived branch.
  workflow_dispatch:

# Cancel superseded runs for the same ref — saves runner minutes on
# rapid pushes to a PR branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (gcc / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Surface hangs fast. x64 finishes well under 2 min; arm64 can queue a
    # little longer, so 8 min is a generous absolute ceiling for both.
    timeout-minutes: 8

    strategy:
      # Run both architectures to completion even if one fails — a red arch
      # is itself the C3 signal, and we want to see the other's result too.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest      # x86_64 (ubuntu-24.04)
          - arch: arm64
            runner: ubuntu-24.04-arm   # native aarch64 (free on public repos)

    env:
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache sysstat

      # Cache key is keyed on the Makefile so a build-flag change forces
      # a fresh ccache miss but doesn't blow the entire object cache
      # when only source files move. The commit-suffixed primary key is
      # never reused (so the cache always saves on success); restore-keys
      # falls through to the nearest Makefile-pinned, then OS-pinned,
      # snapshot.
      - name: ccache restore
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          # Arch-scoped: x64 and arm64 object caches must never mix.
          key: ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ hashFiles('Makefile') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ hashFiles('Makefile') }}-
            ${{ runner.os }}-${{ matrix.arch }}-ccache-

      - name: Configure ccache
        run: |
          ccache --max-size=200M --set-config=compression=true
          # Putting /usr/lib/ccache first in PATH makes `g++` resolve to
          # ccache's compiler wrapper without changing the Makefile.
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache --zero-stats

      - name: Build all
        run: make all

      - name: Unit tests (test-ipc-unit)
        run: make test-ipc-unit

      - name: Integration tests (test-ipc-integration)
        run: make test-ipc-integration

      - name: Router scenarios (test-router)
        run: make test-router

      - name: SHM / UDS leak check
        run: bash robotics-ipc-module/scripts/shm_leak_check.sh

      # Always print ccache stats so the cache hit ratio is visible in
      # logs over time. If it stops being effective, this number drops.
      - name: ccache stats
        if: always()
        run: ccache --show-stats

      # Per the D plan: "Upload build/ipc/test/* on failure for triage."
      # Successful runs don't upload — keeps the artifact list tidy.
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          # Arch-suffixed so the two matrix legs don't collide on upload.
          name: build-ipc-test-binaries-${{ matrix.arch }}
          path: build/ipc/test/
          retention-days: 7
          if-no-files-found: ignore
